name: Python CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  check-code:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj Flake8
        run: |
          python -m pip install flake8

      - name: Sprawdź składnię Pythona
        run: |
          python -m compileall -q .

      - name: Sprawdź styl kodu
        run: |
          flake8 .